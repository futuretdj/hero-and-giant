<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hero & Giant</title>
<meta name="theme-color" content="#1d1640">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hero & Giant">
<style>
:root{--bg:#1d1640;--bg2:#271e55;--card:#2f2566;--line:#43378a;--tx:#fff8ee;--mut:#c3b8e8;--hero:#4fb3ff;--hero2:#1f7fe0;--giant:#ffa64d;--giant2:#e9702a;--gold:#ffd84d;--ok:#6be38f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Trebuchet MS","Segoe UI",-apple-system,Roboto,sans-serif;overscroll-behavior:none}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% 0%,#3a2c86 0%,#1d1640 60%) fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--tx);background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:12px;width:100%;outline:none}
input:focus{border-color:var(--gold)}
#app{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);min-height:100vh}
.scr{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0;font-family:"Trebuchet MS","Segoe UI",sans-serif;letter-spacing:.3px}
.title{font-size:40px;font-weight:900;background:linear-gradient(90deg,var(--hero),#c58bff 50%,var(--giant));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 20px #0004}
.mut{color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:18px;font-weight:800;font-size:17px;background:var(--card);border:2px solid var(--line);transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.gold{background:linear-gradient(180deg,#ffe36e,#ffb92e);color:#3b2300;border:0;box-shadow:0 5px 0 #c27d10,0 10px 24px #0005}
.btn.gold:active{transform:translateY(3px);box-shadow:0 2px 0 #c27d10}
.btn.wide{width:100%}
.btn.hero{background:linear-gradient(180deg,var(--hero),var(--hero2));border:0;box-shadow:0 5px 0 #11549e}
.btn.giant{background:linear-gradient(180deg,var(--giant),var(--giant2));border:0;box-shadow:0 5px 0 #a34a12}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px}
.lbl{font-size:13px;color:var(--mut);margin:14px 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.seg{display:flex;gap:6px;background:var(--bg2);padding:5px;border-radius:14px}
.seg button{flex:1;padding:10px 6px;border-radius:10px;font-weight:700;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 2px 0 #0003}
/* splash */
.splash{text-align:center;padding-top:10px}
.splash .art{width:100%;max-width:420px;aspect-ratio:1;border-radius:32px;object-fit:cover;box-shadow:0 20px 50px #0007;animation:float 5s ease-in-out infinite;border:4px solid #ffffff22}
@keyframes float{50%{transform:translateY(-8px)}}
/* map */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .sp{flex:1}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border-radius:16px;padding:10px 6px;text-align:center;border:2px solid var(--line)}
.stat b{display:block;font-size:22px}
.stat span{font-size:11.5px;color:var(--mut)}
.path{position:relative;padding:10px 0 30px}
.node{position:relative;display:flex;align-items:center;gap:14px;margin:0 0 34px;cursor:pointer}
.node:nth-child(even){flex-direction:row-reverse;text-align:right}
.node:not(:last-child)::after{content:'';position:absolute;left:50%;bottom:-32px;height:30px;border-left:5px dotted #ffd84d55}
.node .pic{position:relative;width:132px;height:132px;flex:none;border-radius:50%;overflow:hidden;border:5px solid #ffffff33;box-shadow:0 10px 26px #0007;transition:filter .6s,transform .2s}
.node .pic img{width:100%;height:100%;object-fit:cover}
.node.locked .pic{filter:grayscale(1) brightness(.55)}
.node.grey .pic{filter:grayscale(1)}
.node.next .pic{border-color:var(--gold);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px #ffd84d33,0 10px 26px #0007;transform:scale(1.04)}}
.node.done .pic{border-color:var(--ok)}
.node .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px}
.node .nm{font-weight:800;font-size:18px}
.node .st{font-size:20px;letter-spacing:2px;margin-top:2px}
.node .bs{font-size:12.5px;color:var(--mut)}
.path svg.trail{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:-1}
/* intro */
.landimg{width:100%;aspect-ratio:3/2;border-radius:24px;object-fit:cover;box-shadow:0 14px 40px #0007;border:4px solid #ffffff22;transition:filter 2.2s ease}
.landimg.grey{filter:grayscale(1) brightness(.8)}
.story{font-size:18px;line-height:1.55;margin:16px 4px}
.safety{font-size:13px;color:var(--mut);text-align:center;margin-top:12px}
/* round */
.boss{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.boss img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #ffffff33;background:#fff}
.boss img.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px) rotate(-8deg)}40%{transform:translateX(8px) rotate(8deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.hp{flex:1}
.hp .bar{height:16px;background:#0005;border-radius:10px;overflow:hidden;border:2px solid #ffffff22}
.hp .bar i{display:block;height:100%;background:linear-gradient(90deg,#b9b4c9,#8a84a3);transition:width .6s}
.hp .nm{font-size:13px;font-weight:800;margin-bottom:4px}
.rtitle{text-align:center;font-weight:900;font-size:22px;margin:4px 0 2px}
.rsub{text-align:center;color:var(--mut);font-size:14px;margin-bottom:8px}
.timer{position:relative;width:170px;height:170px;margin:4px auto 12px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{border-radius:22px;padding:14px 10px;text-align:center;position:relative;overflow:hidden}
.pc.h{background:linear-gradient(180deg,#2c6fd1,#1b4ea3);box-shadow:inset 0 0 0 3px #7cc6ff55}
.pc.g{background:linear-gradient(180deg,#e0782d,#b0521a);box-shadow:inset 0 0 0 3px #ffc58a55}
.pc .who{font-size:12.5px;font-weight:800;opacity:.9;text-transform:uppercase;letter-spacing:.6px}
.pc .em{font-size:48px;line-height:1.1;margin:6px 0}
.pc .mv{font-weight:900;font-size:17px;line-height:1.2}
.pc .tg{display:inline-block;margin-top:8px;background:#0004;border-radius:12px;padding:4px 10px;font-weight:900;font-size:18px}
.pc .how{font-size:12.5px;opacity:.85;margin-top:8px;line-height:1.35}
.ctrl{display:flex;gap:10px;margin-top:14px}
.ctrl .btn{flex:1;font-size:15px;padding:12px}
.check{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
.tog{border-radius:20px;padding:18px 10px;font-weight:800;font-size:16px;border:3px solid transparent;opacity:.55;transition:.2s}
.tog.on{opacity:1;border-color:#fff}
.tog.h{background:linear-gradient(180deg,#2c6fd1,#1b4ea3)}.tog.g{background:linear-gradient(180deg,#e0782d,#b0521a)}
.tog .big{font-size:34px;display:block}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.c3{background:linear-gradient(180deg,#e0782d,#b0521a);border-radius:18px;padding:14px 6px;text-align:center;font-weight:800;font-size:14px;transition:transform .15s;box-shadow:0 5px 0 #7a3810}
.c3:active{transform:scale(.95)}
.c3 .em{font-size:40px;display:block;margin-bottom:6px}
.c3 .t{display:block;margin-top:6px;font-size:16px;background:#0004;border-radius:10px;padding:2px}
.duelbtn{height:150px;border-radius:26px;font-size:20px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.duelbtn.h{background:linear-gradient(180deg,var(--hero),var(--hero2));box-shadow:0 7px 0 #11549e}
.duelbtn.g{background:linear-gradient(180deg,var(--giant),var(--giant2));box-shadow:0 7px 0 #a34a12}
.duelbtn:active{transform:translateY(4px)}
.duelbtn.fin{filter:saturate(.4) brightness(.8);box-shadow:none}
.duelbtn small{font-size:14px;opacity:.9}
.stopw{text-align:center;font-size:44px;font-weight:900;margin:8px 0}
.win{text-align:center;font-size:26px;font-weight:900;color:var(--gold);margin:10px 0;animation:pop .5s}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:none;opacity:1}}
.stars{font-size:52px;text-align:center;letter-spacing:6px;margin:10px 0}
.stars span{display:inline-block;animation:pop .5s backwards}
.rate{display:flex;gap:6px;margin:6px 0 12px}
.rate button{flex:1;padding:10px 4px;border-radius:12px;background:var(--bg2);border:2px solid var(--line);font-weight:700;font-size:13.5px}
.rate button.on{border-color:var(--gold);background:#ffd84d22}
.hitfx{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-size:40px;font-weight:900;color:var(--gold);text-shadow:0 3px 0 #a36a00,0 0 20px #ffd84d;pointer-events:none;animation:hit 1s forwards;z-index:30}
@keyframes hit{0%{transform:translate(-50%,10px) scale(.5);opacity:0}30%{transform:translate(-50%,0) scale(1.2);opacity:1}100%{transform:translate(-50%,-50px) scale(1);opacity:0}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{width:100%;max-width:620px;max-height:90vh;overflow:auto;background:var(--bg2);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));border:2px solid var(--line);animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.album{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.album img{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid #ffffff33}
.album img.no{filter:grayscale(1) brightness(.4)}
.rest{text-align:center}
.rest .em{font-size:60px}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
