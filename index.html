<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hero & Giant</title>
<meta name="theme-color" content="#fbf1de">
<link rel="manifest" href="manifest.json">
<link rel="preload" href="fonts/rubik-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hero & Giant">
<style>
@font-face{font-family:Rubik;src:url(fonts/rubik-latin.woff2) format('woff2');font-weight:300 900;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Rubik;src:url(fonts/rubik-cyrillic.woff2) format('woff2');font-weight:300 900;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;src:url(fonts/nunito-latin.woff2) format('woff2');font-weight:200 1000;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Nunito;src:url(fonts/nunito-cyrillic.woff2) format('woff2');font-weight:200 1000;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
:root{--paper:#fbf1de;--paper2:#f4e4c6;--white:#fffaf0;--ink:#2a1a10;--mut:#7a6150;--hero:#3fa9f5;--hero2:#1d86d6;--giant:#ff6b3d;--giant2:#e2481b;--gold:#ffc93c;--leaf:#56c271;--berry:#ff5c8a;--sh:5px 5px 0 var(--ink)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:17px/1.45 Nunito,"Segoe UI",sans-serif;font-weight:700;overscroll-behavior:none}
body{min-height:100vh;background-color:var(--paper);background-image:radial-gradient(#e6d2ad 1.4px,transparent 1.6px);background-size:22px 22px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--ink);background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:12px;width:100%;outline:none;box-shadow:3px 3px 0 var(--ink)}
input:focus{background:#fff}
#app{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 28px);min-height:100vh}
.scr{animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(10px) rotate(-.5deg)}to{opacity:1;transform:none}}
h1,h2,h3,.rtitle,.btn,.nm,.title,.stat b,.mv,.who,.tg,.lbl{font-family:Rubik,"Segoe UI",sans-serif}
.title{font-size:46px;font-weight:900;color:var(--ink);letter-spacing:-.5px;line-height:1;text-shadow:3px 3px 0 var(--gold)}
.title .amp{color:var(--giant)}
.mut{color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:16px;font-weight:800;font-size:18px;background:var(--white);border:3px solid var(--ink);box-shadow:var(--sh);transition:transform .08s,box-shadow .08s;text-transform:uppercase;letter-spacing:.4px}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn.gold{background:var(--gold)}
.btn.wide{width:100%}
.btn.hero{background:var(--hero);color:#fff}
.btn.giant{background:var(--giant);color:#fff}
.card{background:var(--white);border:3px solid var(--ink);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.row{display:flex;gap:10px}
.lbl{font-size:13px;color:var(--ink);margin:14px 0 6px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.seg{display:flex;gap:6px;background:var(--paper2);padding:5px;border-radius:14px;border:3px solid var(--ink)}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:800;color:var(--mut);font-size:15px}
.seg button.on{background:var(--ink);color:var(--paper)}
/* splash */
.splash{text-align:center;padding-top:8px}
.splash .art{width:86%;max-width:400px;aspect-ratio:1;object-fit:cover;background:#fff;padding:12px 12px 46px;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);transform:rotate(-3deg);animation:wob 6s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-1deg) translateY(-6px)}}
.splash .tape{display:block;width:120px;height:30px;margin:-14px auto 0;background:#ffc93ccc;transform:rotate(4deg);position:relative;z-index:2;border:2px dashed #2a1a1033}
/* map */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .sp{flex:1}
.icon-btn{width:46px;height:46px;border-radius:14px;background:var(--white);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:20px}
.icon-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{border-radius:16px;padding:10px 6px;text-align:center;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.stat:nth-child(1){background:var(--leaf);transform:rotate(-1.5deg)}.stat:nth-child(2){background:var(--white)}.stat:nth-child(3){background:var(--gold);transform:rotate(1.5deg)}
.stat b{display:block;font-size:24px;font-weight:900}
.stat span{font-size:12px;font-weight:800}
.path{position:relative;padding:6px 0 20px}
.node{position:relative;display:flex;align-items:center;gap:16px;margin:0 0 40px;cursor:pointer}
.node:nth-child(even){flex-direction:row-reverse;text-align:right}
.node:not(:last-child)::after{content:'';position:absolute;left:62px;bottom:-40px;height:36px;border-left:4px dashed var(--ink);opacity:.45}
.node:nth-child(even):not(:last-child)::after{left:auto;right:62px}
.node .pic{position:relative;width:128px;height:128px;flex:none;border-radius:50%;overflow:hidden;border:4px solid var(--ink);box-shadow:0 0 0 6px #fff,6px 7px 0 6px var(--ink);transition:filter .6s,transform .2s;background:#fff}
.node .pic img{width:100%;height:100%;object-fit:cover}
.node.locked .pic{filter:grayscale(1) contrast(.8) brightness(1.1)}
.node.grey .pic{filter:grayscale(1)}
.node.next .pic{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}
.node.next .nm::after{content:' ▶';color:var(--giant)}
.node .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px}
.node .nm{font-weight:900;font-size:19px}
.node .st{font-size:20px;letter-spacing:2px;margin-top:2px}
.node .bs{font-size:13px;color:var(--mut)}
/* intro */
.landimg{width:100%;aspect-ratio:3/2;object-fit:cover;border:4px solid var(--ink);border-radius:18px;box-shadow:var(--sh);transition:filter 2.2s ease;background:#fff}
.landimg.grey{filter:grayscale(1)}
.story{font-size:18px;line-height:1.55;margin:16px 2px;font-weight:700;background:var(--white);border:3px solid var(--ink);border-radius:18px;padding:14px 16px;box-shadow:4px 4px 0 var(--ink);position:relative}
.safety{font-size:13.5px;color:var(--mut);text-align:center;margin-top:14px}
/* round */
.boss{display:flex;align-items:center;gap:12px;margin-bottom:12px;background:var(--white);border:3px solid var(--ink);border-radius:18px;padding:8px 10px;box-shadow:4px 4px 0 var(--ink)}
.boss img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid var(--ink);background:#fff}
.boss img.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px) rotate(-10deg)}40%{transform:translateX(8px) rotate(10deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.hp{flex:1}
.hp .bar{height:18px;background:var(--paper2);border-radius:10px;overflow:hidden;border:3px solid var(--ink)}
.hp .bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,#9b8fa8 0 8px,#b7adc2 8px 16px);transition:width .6s}
.hp .nm{font-size:14px;font-weight:900;margin-bottom:4px}
.rtitle{text-align:center;font-weight:900;font-size:26px;margin:6px 0 0}
.rsub{text-align:center;color:var(--mut);font-size:15px;margin-bottom:8px}
.timer{position:relative;width:176px;height:176px;margin:6px auto 14px;background:var(--white);border-radius:50%;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 62px Rubik,sans-serif}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{border-radius:20px;padding:14px 10px;text-align:center;position:relative;border:3px solid var(--ink);box-shadow:var(--sh);color:var(--ink)}
.pc.h{background:#bfe4ff;transform:rotate(-1.2deg)}
.pc.g{background:#ffd0bd;transform:rotate(1.2deg)}
.pc .who{display:inline-block;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;padding:3px 10px;border-radius:10px;border:2px solid var(--ink);color:#fff}
.pc.h .who{background:var(--hero)}.pc.g .who{background:var(--giant)}
.pc .em{font-size:50px;line-height:1.1;margin:8px 0 4px}
.pc .mv{font-weight:900;font-size:17px;line-height:1.15;hyphens:auto;overflow-wrap:anywhere}
.pc .tg{display:inline-block;margin-top:8px;background:var(--gold);border:2px solid var(--ink);border-radius:12px;padding:3px 10px;font-weight:900;font-size:18px}
.pc .how{font-size:13px;margin-top:8px;line-height:1.35;font-weight:700;color:#4a3528}
.ctrl{display:flex;gap:12px;margin-top:18px}
.ctrl .btn{flex:1;font-size:15px;padding:12px}
.check{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 18px}
.tog{border-radius:20px;padding:18px 10px;font:900 16px Rubik,sans-serif;border:3px solid var(--ink);opacity:.45;transition:.15s;box-shadow:2px 2px 0 var(--ink);color:#fff}
.tog.on{opacity:1;box-shadow:var(--sh);transform:rotate(-1deg)}
.tog.h{background:var(--hero)}.tog.g{background:var(--giant)}
.tog .big{font-size:36px;display:block}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.c3{background:#ffd0bd;border:3px solid var(--ink);border-radius:18px;padding:14px 6px;text-align:center;font:800 14px Rubik,sans-serif;transition:transform .12s;box-shadow:var(--sh)}
.c3:nth-child(1){transform:rotate(-2deg)}.c3:nth-child(3){transform:rotate(2deg)}
.c3:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.c3 .em{font-size:42px;display:block;margin-bottom:6px}
.c3 .t{display:block;margin-top:8px;font-size:15px;background:var(--gold);border:2px solid var(--ink);border-radius:10px;padding:2px}
.duelbtn{height:150px;border-radius:24px;font:900 20px Rubik,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:3px solid var(--ink);box-shadow:7px 7px 0 var(--ink);color:#fff}
.duelbtn.h{background:var(--hero)}.duelbtn.g{background:var(--giant)}
.duelbtn:active{transform:translate(5px,5px);box-shadow:2px 2px 0 var(--ink)}
.duelbtn.fin{filter:grayscale(.7);box-shadow:2px 2px 0 var(--ink);transform:translate(4px,4px)}
.duelbtn small{font-size:15px}
.stopw{text-align:center;font:900 46px Rubik,sans-serif;margin:10px 0}
.win{text-align:center;font:900 26px Rubik,sans-serif;color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:16px;padding:8px;margin:14px 0;box-shadow:var(--sh);animation:pop .5s;transform:rotate(-1.5deg)}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:rotate(-1.5deg);opacity:1}}
.stars{font-size:54px;text-align:center;letter-spacing:6px;margin:12px 0}
.stars span{display:inline-block;animation:pop2 .5s backwards}
@keyframes pop2{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2)}100%{transform:none;opacity:1}}
.rate{display:flex;gap:6px;margin:6px 0 12px}
.rate button{flex:1;padding:10px 4px;border-radius:12px;background:var(--paper2);border:3px solid var(--ink);font-weight:800;font-size:14px}
.rate button.on{background:var(--gold);box-shadow:3px 3px 0 var(--ink)}
.hitfx{position:fixed;left:50%;top:20%;transform:translateX(-50%);font:900 44px Rubik,sans-serif;color:var(--gold);-webkit-text-stroke:2.5px var(--ink);text-shadow:4px 4px 0 var(--ink);pointer-events:none;animation:hit 1s forwards;z-index:30}
@keyframes hit{0%{transform:translate(-50%,10px) scale(.5) rotate(-10deg);opacity:0}30%{transform:translate(-50%,0) scale(1.25) rotate(-6deg);opacity:1}100%{transform:translate(-50%,-50px) scale(1) rotate(-6deg);opacity:0}}
.confetti{position:fixed;top:-20px;width:12px;height:16px;z-index:40;pointer-events:none;border:2px solid var(--ink);animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.modal{position:fixed;inset:0;background:#2a1a1088;display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{width:100%;max-width:620px;max-height:90vh;overflow:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));border:3px solid var(--ink);border-bottom:0;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.album{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.album img{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid var(--ink);box-shadow:0 0 0 3px #fff}
.album img.no{filter:grayscale(1) contrast(.7) brightness(1.15)}
.rest{text-align:center}
.rest .em{font-size:64px}
.pro{background:#ffe0ea}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
